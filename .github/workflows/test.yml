name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build agent name map
        run: node scripts/build-agent-map.js

      - name: Auto-generate missing mocks
        run: node scripts/generate-mocks.js

      - name: Run tests
        run: npm test
        env:
          ANTHROPIC_API_KEY: mock-key-for-testing
